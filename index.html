
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bahria Town Karachi Digital Map</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f1;
  color: #222;
}

header {
  background: #14532d;
  color: white;
  text-align: center;
  padding: 18px 10px;
}

header h2 {
  margin: 0 0 6px;
  font-size: 23px;
}

header p {
  margin: 0;
  font-size: 14px;
}

.search {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  background: white;
}

input {
  flex: 1;
  min-width: 125px;
  padding: 12px;
  border: 1px solid #bbb;
  border-radius: 6px;
  font-size: 16px;
}

button {
  padding: 12px 16px;
  border: 0;
  border-radius: 6px;
  background: #166534;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

.tools {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px;
}

#status {
  padding: 10px 12px;
  font-size: 14px;
  background: white;
}

#map-view {
  width: 100%;
  height: 65vh;
  min-height: 350px;
  overflow: auto;
  background: #e5e7eb;
  border-top: 1px solid #ccc;
  text-align: center;
}

#map-image {
  display: block;
  width: 100%;
  max-width: none;
  height: auto;
  transform-origin: top left;
}

footer {
  padding: 14px;
  text-align: center;
  font-size: 13px;
  color: #555;
}
</style>
</head>

<body>

<header>
  <h2>Bahria Town Karachi</h2>
  <p>Digital Map — Precinct 1</p>
</header>

<div class="search">
  <input id="precinct" value="P1"
         placeholder="Enter precinct">
  <input id="plot" placeholder="Plot / House number">
  <button onclick="searchPlot()">Search</button>
</div>

<div class="tools">
  <button onclick="zoomIn()">Zoom +</button>
  <button onclick="zoomOut()">Zoom −</button>
  <button onclick="resetZoom()">Reset</button>
</div>

<div id="status">
  Loading Precinct 1 map...
</div>

<div id="map-view">
  <img id="map-image"
       src="p1_map_preview.png"
       alt="Bahria Town Karachi Precinct 1 Map"
       onload="imageLoaded()"
       onerror="imageFailed()">
</div>

<footer>
  Bahria Town Karachi Digital Map
</footer>

<script>
let zoom = 1;

const img = document.getElementById('map-image');
const statusBox = document.getElementById('status');

function imageLoaded() {
  statusBox.textContent =
    'Precinct 1 map loaded. Use Zoom buttons to inspect details.';
}

function imageFailed() {
  statusBox.textContent =
    'Map image not found. Check that p1_map_preview.png ' +
    'is uploaded beside index.html in the repository.';
}

function applyZoom() {
  img.style.width = (100 * zoom) + '%';
}

function zoomIn() {
  zoom = Math.min(zoom + 0.25, 4);
  applyZoom();
}

function zoomOut() {
  zoom = Math.max(zoom - 0.25, 0.5);
  applyZoom();
}

function resetZoom() {
  zoom = 1;
  applyZoom();
}

function searchPlot() {
  const precinct =
    document.getElementById('precinct').value.trim();
  const plot =
    document.getElementById('plot').value.trim();

  if (!precinct || !plot) {
    statusBox.textContent =
      'Please enter a precinct and plot/house number.';
    return;
  }

  statusBox.textContent =
    'Search requested: ' + precinct + ', Plot/House ' + plot +
    '. Exact plot search will be enabled after verified plot data is added.';
}
</script>

</body>
</html>
