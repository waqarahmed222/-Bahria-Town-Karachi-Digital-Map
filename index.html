
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bahria Town Karachi Maps</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f4;
      color: #17352a;
    }
    header {
      background: #145b3b;
      color: white;
      padding: 22px 16px;
    }
    header h1 {
      font-size: 23px;
      margin: 0 0 8px;
    }
    header p {
      margin: 0;
      font-size: 14px;
    }
    main {
      padding: 18px;
      max-width: 600px;
      margin: auto;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #cbd8cf;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      background: #145b3b;
      color: white;
      border: none;
      font-weight: bold;
    }
    .panel {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin-top: 16px;
      box-shadow: 0 2px 8px #00000010;
    }
    .map {
      min-height: 180px;
      background: #e1eadf;
      border-radius: 10px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bahria Town Karachi Maps</h1>
    <p>Your digital guide to Bahria Town Karachi</p>
  </header>

  <main>
    <div class="panel">
      <h2>Find a Plot or House</h2>
      <input id="precinct" placeholder="Precinct (e.g. 10A)">
      <input id="plot" placeholder="Plot or house number">
      <button onclick="searchPlot()">Search Location</button>
      <p id="result">Enter a precinct and plot number to begin.</p>
    </div>

    <div class="panel">
      <h2>Map Area</h2>
      <div class="map">
        <p>Our digital plot map will be added here.<br>
        Verified maps and locations will come next.</p>
      </div>
    </div>
  </main>

  <script>
    function searchPlot() {
      const precinct = document.getElementById('precinct').value.trim();
      const plot = document.getElementById('plot').value.trim();
      const result = document.getElementById('result');

      if (!precinct || !plot) {
        result.textContent = 'Please enter both precinct and plot number.';
        return;
      }

      result.textContent =
        'Search requested: Precinct ' + precinct +
        ', Plot/House ' + plot +
        '. Verified map data will be connected in the next step.';
    }
  </script>
</body>
</html>
