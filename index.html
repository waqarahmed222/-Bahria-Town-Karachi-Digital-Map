
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bahria Town Karachi Digital Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f4}
header{background:#176b43;color:white;padding:18px 12px;text-align:center}
header h2{margin:0 0 6px}
main{padding:14px}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:6px 0;border-radius:7px;font-size:16px}
input{border:1px solid #aaa}
button{background:#176b43;color:white;border:0;font-weight:bold}
#map{height:55vh;min-height:320px;border:1px solid #ccc;border-radius:8px}
#message{font-size:14px;line-height:1.5}
footer{text-align:center;padding:14px;color:#555;font-size:12px}
</style>
</head>
<body>
<header>
<h2>Bahria Town Karachi Maps</h2>
<div>Digital Map Project</div>
</header>
<main>
<label for="precinct">Precinct / Area</label>
<input id="precinct" placeholder="e.g. Precinct 10A">
<label for="plot">Plot / House Number</label>
<input id="plot" placeholder="Enter plot or house number">
<button onclick="searchLocation()">Search Location</button>
<p id="message">Map load hone ka intezar karein. Plot search ka data baad mein add hoga.</p>
<div id="map"></div>
</main>
<footer>Community Mapping Project · Bahria Town Karachi</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([25.005,67.305],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19,
attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);
function searchLocation(){
const p=document.getElementById('precinct').value.trim();
const n=document.getElementById('plot').value.trim();
if(!p||!n){
document.getElementById('message').textContent='Please enter both precinct and plot/house number.';
return;
}
document.getElementById('message').textContent='Search: '+p+', Plot/House '+n+'. Verified plot locations abhi add nahi hui hain.';
}
</script>
</body>
</html>
